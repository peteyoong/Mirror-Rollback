# Lens-jargon regression suite for intent_router_v2 (Slice B1.3 + B3.1).
# Targets astrology / human design / enneagram / numerology / bazi
# terminology that real users use.  Routing rule (post B3.1):
#   * generic "my X" lens jargon → identity (self-inquiry through a lens)
#   * specific house numbers / lens-objects WITH a contextual cue
#       (relational / career / family / money / temporal) → that domain
#   * specific house numbers / lens-objects WITHOUT a contextual cue
#       (post B3.1) → identity (educational-mode disambiguation)
#   * partner-name + lens jargon → relationship via role-bias path
# Ids prefixed `LJ`.

# --- ASTROLOGY: self-inquiry ---
- id: LJ1
  message: "Tell me about my Saturn return"
  active_frame: self
  expected_primary: life_direction
  expected_secondary_in: [identity, growth]

- id: LJ2
  message: "What's my Sun sign all about?"
  active_frame: self
  expected_primary: identity

- id: LJ3
  message: "Tell me about my chart"
  active_frame: self
  expected_primary: identity

- id: LJ4
  message: "What does my rising sign say?"
  active_frame: self
  expected_primary: identity

- id: LJ5
  message: "What are my current transits doing to me?"
  active_frame: self
  expected_primary: identity
  expected_secondary_in: [growth, life_direction]


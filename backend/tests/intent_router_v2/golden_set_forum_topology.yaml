# Forum-topology regression suite (P4 plumbing).
# These prompts arrive on a forum surface with `forum_topology.
# active_member_id` supplied — the resolver should bind that as the
# active member and route the intent to relationship (or growth in
# some cases) with `context_mode = RELATIONAL`.
# Ids prefixed `FT`.

- id: FT1
  message: "Tell me about this forum member."
  active_frame: forum
  forum_topology:
    forum_id: "forum-001"
    active_member_id: "kara-001"
    members:
      - {id: "kara-001", name: "Kara"}
  expected_primary: relationship


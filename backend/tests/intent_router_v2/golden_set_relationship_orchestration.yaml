# P3 Relationship-Aware Orchestration golden set (2026-06-14).
# Validates lens-priority modulation across the five relationship buckets:
#   spouse / child / cofounder / forum_member / self
# Each case asserts:
#   * expected_bucket           — which orchestration rule fired
#   * expected_top_lens         — first lens after re-ranking
#   * expected_framing_hint     — surface label
#   * expected_applied_rules_contains — telemetry sanity


# Relationship / Forum / Member / Between-You-Today regression suite for
# intent_router_v2.  These surfaces are the highest-risk in production
# because they combine frame + target + domain in one routing decision.
# Ids prefixed `RF`.

# --- Self frame, partner target (Mel-style) ---
- id: RF1
  message: "What's happening between Mel and me today?"
  active_frame: self
  current_target_id: mel
  relationship_role: partner
  expected_primary: relationship

- id: RF2
  message: "How can I show up better with my partner this week?"
  active_frame: self
  relationship_role: partner

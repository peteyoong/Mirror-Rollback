# Render.com Deployment Configuration
# Deploy: Connect your GitHub repo to Render and use this file

services:
  - type: web
    name: mirror-api
    env: python
    region: oregon
    plan: starter  # $7/month - never sleeps
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URL
        sync: false  # Set manually in Render dashboard
      - key: EMERGENT_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: PYTHON_VERSION
        value: 3.11.0
